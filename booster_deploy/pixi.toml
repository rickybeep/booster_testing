[workspace]
name = "booster-deploy"
version = "0.2.0"
description = "Joystick walk and squat policy deployment for Booster K1"
authors = ["Team whIRLwind"]
channels = [
    "https://prefix.dev/conda-forge",
    "https://prefix.dev/robostack-humble",
]
platforms = [
    { platform = "linux-64", glibc = "2.35" },
    { platform = "linux-aarch64", glibc = "2.35" },
    "osx-arm64",
]

[dependencies]
python = ">=3.11,<3.12"
numpy = ">=1.26,<3"
pytorch = ">=2.5,<3"
mujoco = ">=3.3,<4"
onnxruntime = ">=1.20,<2"
ruff = ">=0.12,<1"

[pypi-dependencies]
booster-sdk = "==0.1.2-alpha.2"
py-trees = ">=2.3, <3"

[environments]
ros = ["ros"]

[tasks]
list-tasks = "python scripts/deploy.py --list"
lint = "ruff check --select E4,E7,E9,F ."

[feature.ros.dependencies]
compilers = "*"
cmake = "*"
make = "*"
ninja = "*"
pkg-config = "*"
colcon-common-extensions = ">=0.3"
setuptools = ">=75,<76"
ros-humble-desktop = "==0.10.0"
onnxruntime-cpp = ">=1.20,<2"
nlohmann_json = ">=3.11,<4"
pybind11 = ">=2.12,<4"
# rosidl in Humble uses the empy 3 template API.
empy = ">=3.3,<4"

[feature.ros.target.osx-arm64.activation]
scripts = ["scripts/osx-env-vars.sh"]

[feature.ros.tasks]
ros-build = "cd ros2_ws && CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN) MAKEFLAGS=-j$(getconf _NPROCESSORS_ONLN) colcon build --symlink-install --merge-install --parallel-workers $(getconf _NPROCESSORS_ONLN) --cmake-args -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY"
deploy = { cmd = "./scripts/ros-env.sh python scripts/deploy.py", depends-on = ["ros-build"] }
deploy-mujoco = { cmd = "./scripts/ros-env.sh python scripts/deploy.py --mujoco", depends-on = ["ros-build"] }
policy-node = { cmd = "./scripts/ros-env.sh python scripts/deploy.py --policy-node-only", depends-on = ["ros-build"] }
test = { cmd = "./scripts/ros-env.sh python -m pytest tests", depends-on = ["ros-build"] }
